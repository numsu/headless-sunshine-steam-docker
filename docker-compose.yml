services:
  sunshine-steam:
    build:
      context: .
      args:
        ENABLE_BOLT: "${ENABLE_BOLT:-false}"
    image: headless-sunshine-steam:local
    container_name: headless-sunshine-steam
    restart: unless-stopped
    network_mode: host

    ipc: host
    shm_size: "4gb"

    environment:
      SUNSHINE_CORS_ORIGIN: ${SUNSHINE_CORS_ORIGIN}
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_GPU_ID}"
      NVIDIA_DRIVER_CAPABILITIES: all
      XORG_DISPLAY: "${XORG_DISPLAY:-DP-0}"
      XORG_WIDTH: "${XORG_WIDTH:-3840}"
      XORG_HEIGHT: "${XORG_HEIGHT:-2160}"

    runtime: nvidia

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID}"]
              capabilities: [gpu]

    devices:
      - /dev/uinput:/dev/uinput
      - /dev/dri:/dev/dri
      # Required for NVIDIA Vulkan presentation; create on the host before startup.
      - /dev/nvidia-modeset:/dev/nvidia-modeset

    volumes:
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - ./data:/home/gamer
      - "${GAMES_DIR:-./data/games}:/games"

    device_cgroup_rules:
      - "c 13:* rwm"
      - "c 226:* rwm"

    cap_add:
      - SYS_NICE

    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

